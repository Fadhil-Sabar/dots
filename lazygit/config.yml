gui:
  theme:
    activeBorderColor:
      - "#8caaee"
      - bold
    inactiveBorderColor:
      - "#a5adce"
    optionsTextColor:
      - "#8caaee"
    selectedLineBgColor:
      - "#414559"
    cherryPickedCommitBgColor:
      - "#51576d"
    cherryPickedCommitFgColor:
      - "#8caaee"
    unstagedChangesColor:
      - "#e78284"
    defaultFgColor:
      - "#c6d0f5"
    searchingActiveBorderColor:
      - "#e5c890"

  authorColors:
    "*": "#babbf1"
customCommands:
  - key: 'Y'
    context: 'commits'
    description: 'Copy link and title'
    command: |
      sh -c '
        REMOTE_URL=$(git remote get-url origin | sed -E "s/\.git$//; s#git@([^:]+):#https://\1/#")
        if [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1; then
          printf "%s/commit/%s\n%s" "$REMOTE_URL" "$1" "$2" | wl-copy
        elif command -v xclip >/dev/null 2>&1; then
          printf "%s/commit/%s\n%s" "$REMOTE_URL" "$1" "$2" | xclip -selection clipboard
        elif command -v xsel >/dev/null 2>&1; then
          printf "%s/commit/%s\n%s" "$REMOTE_URL" "$1" "$2" | xsel --clipboard --input
        else
          echo "Install wl-clipboard, xclip, or xsel to copy to the clipboard" >&2
          exit 1
        fi
      ' sh {{.SelectedLocalCommit.Hash}} {{.SelectedLocalCommit.Name | quote}}
    loadingText: 'Copying...'
os:
  editCommand: 'nvim' # Example
services:
  '10.93.1.21': 'gitlab:10.93.1.21'
